version: "3.9"

services:
  api:
    build: .
    container_name: ai-api-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/ai_api
      - DATABASE_SYNC_URL=postgresql://postgres:postgres@db:5432/ai_api
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - ai_network

  db:
    image: postgres:16-alpine
    container_name: ai-api-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai_network

  redis:
    image: redis:7-alpine
    container_name: ai-api-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ai_network

volumes:
  postgres_data:

networks:
  ai_network:
    driver: bridge
